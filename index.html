    <script>
      const originalLog = console.log;
      console.log = function(...args) {
        if (typeof args[0] === 'string') {
          if (args[0].includes('WebSocketInterceptor-Proxy') ||
              args[0].includes('Service Worker registered') ||
              args[0].includes('Service Worker:')) {
            return;
          }
        }
        originalLog.apply(console, args);
      };
      const originalInfo = console.info;
      console.info = function(...args) {
        if (typeof args[0] === 'string' && args[0].includes('WebSocketInterceptor-Proxy')) return;
        originalInfo.apply(console, args);
      };
    </script>

    <!-- Icono para el Navegador (Pestaña) -->
    <link rel="icon" type="image/png" href="/farmacia_del_este_logo.png" />
    
    <!-- Icono para Pantalla de Inicio (iOS) - Forzamos v8 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa_icon.png?v=9">
